<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light"><title>Lichtzentrale · Vorschau 5b</title>
<style>
:root{--paper:#f5f2eb;--ink:#252a27;--muted:#666c64;--line:#dcded3;--green:#295945;--lime:#e2edaf;--white:#fffef9;--orange:#f6c99c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #a15825;outline-offset:3px}button,input:not([type=checkbox]):not([type=range]):not([type=color]),select{min-height:48px}button{border-radius:16px;padding:12px 17px;background:#e8e9df;color:var(--ink);font-weight:650}button:hover{filter:brightness(.97)}button.primary{background:var(--green);color:white}button.quiet{background:transparent;padding:12px 0;color:var(--green)}button.small{font-size:14px;padding:9px 13px}button[aria-pressed=true],.chip.selected{background:var(--green);color:white}button.danger{color:#8b332b}input,select{max-width:100%;border:1px solid var(--line);background:var(--white);border-radius:12px;padding:9px 12px;color:var(--ink)}input[type=range]{width:100%;min-height:44px;padding:0;accent-color:var(--green)}input[type=checkbox]{width:22px;height:22px;accent-color:var(--green);flex-shrink:0}input[type=color]{width:65px;height:46px}label.field{display:grid;gap:6px;margin:14px 0;font-size:14px;font-weight:650}label.check{display:flex;gap:12px;align-items:center;min-height:48px;font-size:15px}.banner{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:10px 16px;text-align:center;font-size:11px;font-weight:650;letter-spacing:.03em}.shell{max-width:820px;margin:auto;padding:25px 22px 125px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{font-size:14px;font-weight:750;letter-spacing:.02em}.mark{display:inline-flex;width:29px;height:29px;background:var(--green);color:var(--lime);border-radius:50%;align-items:center;justify-content:center;margin-right:7px}.badge{font-size:11px;padding:5px 9px;border:1px solid var(--line);border-radius:20px;color:var(--muted)}h1{font-size:36px;line-height:1.12;letter-spacing:-1.3px;margin:8px 0 12px;font-weight:650}h2{font-size:20px;letter-spacing:-.4px;margin:25px 0 13px}h3{font-size:17px;margin:0 0 8px}.eyebrow{color:var(--green);font-size:11px;text-transform:uppercase;font-weight:750;letter-spacing:.15em}p{margin:8px 0 16px}.muted,.hint{color:var(--muted);font-size:14px}.hint{font-size:12px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.wrap{flex-wrap:wrap;justify-content:flex-start}.grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}.stack{display:grid;gap:13px}.card{padding:19px;border:1px solid var(--line);border-radius:25px;background:var(--white)}.hero{background:var(--green);color:white;position:relative;overflow:hidden;padding:24px;border-radius:27px;margin:24px 0}.hero:after{content:'';position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#b7c98a66,transparent 68%);right:-50px;top:-60px;pointer-events:none}.hero p{max-width:270px;color:#dfebd8;font-size:14px}.hero h2{margin:0 0 8px;font-size:25px}.hero button{background:var(--lime)}.room{position:relative;overflow:hidden}.room:before{content:'';display:block;height:5px;background:linear-gradient(90deg,#edb06d,#dace9f,#9da789);position:absolute;top:0;left:0;right:0}.room-title{background:none;text-align:left;padding:0;min-height:52px;width:100%;font-size:20px;letter-spacing:-.5px}.room-title span{display:block;font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}.power{border-radius:50%;width:48px;flex-shrink:0;padding:0}.power.on{background:var(--green);color:white}.room .hint{min-height:18px}.palette{height:116px;border-radius:19px;margin-bottom:12px;background:var(--gradient);position:relative;overflow:hidden}.palette:after{content:'';width:90px;height:90px;border-radius:50%;background:#fff2;filter:blur(10px);position:absolute;right:10px;top:20px}.palette-button{display:block;width:100%;background:none;text-align:left;padding:0}.palette-button .palette{margin-bottom:8px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fffef9f5;border-top:1px solid var(--line);backdrop-filter:blur(12px);padding:7px 8px max(10px,env(safe-area-inset-bottom));display:flex;justify-content:center}.tabs button{background:transparent;display:grid;gap:3px;justify-items:center;width:min(20%,145px);font-size:10px;padding:7px 2px;color:var(--muted);border-radius:15px}.tabs .active{color:var(--green);background:#e8eddc}.tab-icon{font-size:22px;line-height:24px;font-weight:400}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--white);padding:10px 13px;min-width:44px}details{border-top:1px solid var(--line);margin-top:18px;padding-top:8px}summary{cursor:pointer;min-height:48px;display:flex;align-items:center;gap:9px;font-weight:650;font-size:14px}summary:before{content:'+';font-size:20px}details[open]>summary:before{content:'−'}.back{margin:0 0 18px}.status{border-radius:13px;background:#edf0e3;padding:11px 13px;font-size:13px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.full{width:100%}.steps{display:flex;gap:8px;margin:20px 0}.steps span{padding:8px 11px;border-radius:12px;background:#e5e7dd;font-size:13px;flex:1}.steps .current{background:var(--green);color:white}.targets{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:15px;padding:7px 12px}.device{display:grid;justify-content:center;gap:6px;margin:20px auto;background:#e8e9e3;padding:12px;border:2px solid #d5d8ce;box-shadow:0 9px 0 #d5d8ce;border-radius:24px;width:124px}.device button{background:white;border:1px solid #d1d6cb;width:96px;min-height:46px;padding:8px}.device.dial{border-radius:50%;width:150px;height:150px;grid-template-columns:1fr 1fr;align-items:center;padding:15px}.device.dial button{width:52px;border-radius:50%;padding:8px}.device.wall{width:155px;grid-template-columns:1fr 1fr}.device.wall button{width:56px;height:75px}.device.shelly{width:120px;background:#d8e5df;border-radius:21px}.device.shelly button{width:92px}.position-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.position-grid button{height:56px}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);width:min(90%,600px);z-index:40;background:var(--ink);color:white;padding:13px 18px;border-radius:17px;box-shadow:0 5px 30px #0002;font-size:14px}.toast:empty{display:none}.log{font-size:13px;padding-left:20px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}hr{border:0;border-top:1px solid var(--line);margin:18px 0}.notice{border-left:3px solid #b77c3c;padding-left:12px;font-size:13px;color:var(--muted)}.swatch{width:28px;height:28px;background:var(--gradient);border-radius:50%;display:inline-block;vertical-align:middle;margin-right:8px}@media(max-width:370px){.shell{padding-left:15px;padding-right:15px}.card{padding:14px}.room-title{font-size:18px}h1{font-size:32px}.split{grid-template-columns:1fr}}@media(min-width:650px){h1{font-size:48px}.shell{padding-top:35px}.hero{padding:30px}.grid.rooms{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,filter .15s}}
</style>
</head>
<body>
<div class="banner" data-testid="prototype-banner">Vorschau · nur Beispieldaten · keine Geräte werden gesteuert</div>
<div class="shell"><header><div class="brand"><span class="mark">✳</span>Lichtzentrale</div><span class="badge">ENTWURF 5b</span></header><main id="app"></main></div>
<nav class="tabs" aria-label="Hauptnavigation" id="tabs"></nav><div class="toast" role="status" aria-live="polite" id="toast"></div>
<script>
// Geändert für Lichtzentrale: unabhängiger Phase-1-Entwurf, ausschließlich flüchtige Beispieldaten.
'use strict';
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = value => JSON.parse(JSON.stringify(value));
const palettes = [
 {name:'Abend',colors:['#d8884d','#f5bf84','#747f68'],gradient:'linear-gradient(125deg,#92644f,#ecad73 50%,#899878)'},
 {name:'Morgentau',colors:['#91b3a7','#d7dbad','#a7bdbf'],gradient:'linear-gradient(125deg,#689c96,#c6d8aa 55%,#d8e3d3)'},
 {name:'Beerenlicht',colors:['#9a617a','#cc8c87','#e2bb92'],gradient:'linear-gradient(125deg,#654c78,#bc7886 55%,#e6b99a)'},
 {name:'Sand & Sonne',colors:['#c5a16c','#f0d6a2','#e9bc70'],gradient:'linear-gradient(125deg,#ad9060,#f0d6a2 55%,#e6b865)'}
];
const actionNames={scene:'Szene',night:'Nachtlicht',off:'Ausschalten',brightness:'Helligkeit',full:'Volle Helligkeit · neutrales Weiß',auto:'Zurück zur Automatik',nightauto:'Nachtlicht ⇄ Automatik',on:'Einschalten',toggle:'Ein / Aus',next:'Nächste Szene',up:'Heller',down:'Dunkler',stop:'Dynamik stoppen',motionon:'Bewegungsautomatik an',motionoff:'Bewegungsautomatik aus',naturalon:'Natürliches Licht an',naturaloff:'Natürliches Licht aus'};
const days=['Mo','Di','Mi','Do','Fr','Sa','So'];
const initial = () => ({
 tab:'home',detail:null,sceneDraft:null,zoneForm:false,palette:null,device:null,button:'An',event:'Kurz drücken',al:false,
 lights:[{id:'l1',name:'Leselicht',room:'r1',on:true,bri:62,color:'#efbe87',kelvin:2700,grant:true},{id:'l2',name:'Wandleuchte',room:'r1',on:true,bri:45,color:'#d68f61',kelvin:2700,grant:true},{id:'l3',name:'Pendelleuchte',room:'r2',on:true,bri:70,color:'#f5d4a6',kelvin:3000,grant:true},{id:'l4',name:'Deckenlicht',room:'r3',on:false,switch:true,grant:true},{id:'l5',name:'Orientierungslicht',room:'r3',on:false,bri:12,color:'#ffd09a',kelvin:2400,grant:true}],
 groups:[{id:'r1',name:'Sofa',kind:'Raum',lights:['l1','l2']},{id:'r2',name:'Essplatz',kind:'Raum',lights:['l3']},{id:'r3',name:'Flur',kind:'Raum',lights:['l4','l5']},{id:'z1',name:'Wohnbereich',kind:'Zone',lights:['l1','l3','l5']}],
 current:{r1:'Abend',r2:'Abend',r3:'Aus',z1:'Abend'},automatic:{},night:{},positions:{},settings:{},scenes:[],favorites:['Abend'],dynamic:{},logs:[],bindings:{},capture:null,captured:[],wizard:null,
 automations:[{id:'a1',trigger:'sunset',offset:-15,time:'22:30',days:[0,1,2,3,4,5,6],enabled:false,actions:[{targets:['z1'],type:'scene',scene:'Abend',bri:50}]},{id:'a2',trigger:'clock',offset:0,time:'22:30',days:[0,1,2,3,4,5,6],enabled:false,actions:[{targets:['z1'],type:'off',scene:'Abend',bri:50},{targets:['r3'],type:'night',scene:'Abend',bri:12}]}]
});
let state=initial(),toastTimer,renderedView;
const group=id=>state.groups.find(g=>g.id===id);
const light=id=>state.lights.find(l=>l.id===id);
const name=id=>group(id)?.name||light(id)?.name||id;
const lamps=id=>(group(id)?group(id).lights.map(light):[light(id)]).filter(l=>l&&l.grant);
const allTargets=()=>[...state.groups,...state.lights.filter(l=>l.grant).map(l=>({...l,kind:'Lampe'}))];
const on=id=>lamps(id).some(l=>l.on);
const brightness=id=>{const ls=lamps(id).filter(l=>!l.switch);return ls.length?Math.round(ls.reduce((n,l)=>n+l.bri,0)/ls.length):0;};
const btn=(label,action,extra='',cls='')=>`<button type="button" class="${cls}" data-action="${action}" ${extra}>${label}</button>`;
const field=(label,html)=>`<label class="field">${label}${html}</label>`;
const options=(entries,value)=>entries.map(([v,n])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(n)}</option>`).join('');
const groupOptions=value=>options(state.groups.map(g=>[g.id,`${g.kind} ${g.name}`]),value);
const actionOptions=value=>options(Object.entries(actionNames).filter(([k])=>state.al||!k.startsWith('natural')),value);
const range=(id,value,action,extra='')=>`<input type="range" id="${id}" min="1" max="100" value="${value}" data-change="${action}" ${extra}>`;
function notify(message){clearTimeout(toastTimer);$('toast').textContent=message;toastTimer=setTimeout(()=>$('toast').textContent='',4500);}
function log(message){state.logs.unshift(message);notify(message);}
function navigate(tab){state.tab=tab;state.detail=null;state.sceneDraft=null;state.zoneForm=false;state.palette=null;state.device=null;state.wizard=null;render();window.scrollTo?.(0,0);}
function checks(selected,change,extra=''){return `<div class="targets">${allTargets().map(t=>`<label class="check"><input type="checkbox" data-change="${change}" value="${t.id}" ${selected.includes(t.id)?'checked':''} ${extra}><span>${esc(t.name)} <small class="hint">${t.kind}${t.switch?' · nur Ein/Aus':''}</small></span></label>`).join('')}</div>`;}
function power(id){return btn(on(id)?'◉':'○','power',`data-id="${id}" data-testid="power-${id}" aria-label="${esc(name(id))} ${on(id)?'ausschalten':'einschalten'}" aria-pressed="${on(id)}"`,'power '+(on(id)?'on':''));}
function roomCard(g){return `<article class="card room"><div class="row">${btn(esc(g.name),'detail',`data-id="${g.id}" data-testid="open-${g.id}"`,'room-title')}${power(g.id)}</div>${lamps(g.id).some(l=>!l.switch)?range('slider-'+g.id,brightness(g.id),'brightness',`data-id="${g.id}" data-testid="brightness-${g.id}" aria-label="Helligkeit ${esc(g.name)}"`):''}</article>`;}
function home(){return `<h1>Zuhause</h1><div class="row"><h2>Zonen</h2>${btn('+ Neue Zone','zone-new','data-testid="new-zone"','quiet')}</div>${state.zoneForm?zoneEditor():''}<div class="grid zone-grid">${state.groups.filter(g=>g.kind==='Zone').map(roomCard).join('')}</div><h2>Räume</h2><div class="grid rooms">${state.groups.filter(g=>g.kind==='Raum').map(roomCard).join('')}</div>`;}
function zoneEditor(){return `<section class="card" data-testid="zone-editor"><h3>Deine neue Zone</h3>${field('Name','<input id="zone-name" placeholder="Zum Beispiel Abendrunde" maxlength="40">')}<p class="hint">Wähle Lampen aus beliebigen Räumen.</p>${state.lights.filter(l=>l.grant).map(l=>`<label class="check"><input type="checkbox" name="zone-lamp" value="${l.id}">${esc(l.name)} · ${name(l.room)}${l.switch?' · nur Ein/Aus':''}</label>`).join('')}<div class="actions">${btn('Zone in Vorschau anlegen','zone-save','data-testid="save-zone"','primary')}${btn('Abbrechen','zone-cancel')}</div></section>`;}
function detail(){const g=group(state.detail),id=g.id;return `${btn('← Zuhause','back','','quiet back')}<div class="eyebrow">${g.kind} · ${lamps(id).length} Leuchten</div><div class="row"><h1>${esc(g.name)}</h1>${power(id)}</div><p class="muted">${esc(state.current[id]||'Individuell')} · ${brightness(id)} %</p>${range('detail-brightness',brightness(id),'brightness',`data-id="${id}" aria-label="Helligkeit ${esc(g.name)}"`)}<div class="actions">${btn('Nachtlicht','apply',`data-id="${id}" data-type="night" data-testid="night-light"`,'small')}${btn('+ Neue Szene','scene-new',`data-id="${id}" data-testid="new-scene"`,'small')}</div>${state.sceneDraft?sceneEditor():''}<h2>Deine Szenen</h2><div class="grid">${palettes.slice(0,2).map(p=>sceneTile(p,id)).join('')}${state.scenes.filter(s=>s.target===id).map(s=>`<article class="card"><h3>${esc(s.name)}</h3><p class="hint">Eigene Szene · ${s.kind}</p>${btn('Aktivieren','snapshot-apply',`data-id="${s.id}"`)}</article>`).join('')}</div><details><summary>Nachtlicht bearbeiten</summary>${field('Szenenname',`<input id="night-name" value="${esc(state.night[id]?.name||'Leiser Abend')}">`)}${field('Helligkeit',range('night-bri',state.night[id]?.bri||12,'readout'))}${btn('In Vorschau übernehmen','night-save',`data-id="${id}"`)}</details><h2>Einzelne Lampen</h2><div class="stack">${lamps(id).map(l=>lampEditor(l)).join('')}</div><div class="actions">${btn('Dynamik stoppen','apply',`data-id="${id}" data-type="stop"`)}</div><details data-testid="room-options"><summary>Mehr Optionen</summary>${advancedRoom(id)}</details>`;}
function lampEditor(l,draft=false){return `<article class="card"><div class="row"><div><h3>${l.name}</h3><span class="hint">${l.switch?'Nur Ein / Aus':l.bri+' % · '+l.kelvin+' K'}</span></div>${draft?btn(l.on?'◉':'○','scene-power',`data-testid="scene-power-${l.id}" data-id="${l.id}" aria-label="${esc(l.name)} ${l.on?'ausschalten':'einschalten'}" aria-pressed="${l.on}"`,'power '+(l.on?'on':'')):power(l.id)}</div>${l.switch?'':`${range((draft?'scene-lamp-':'lamp-')+l.id,l.bri,draft?'scene-brightness':'brightness',`data-id="${l.id}" aria-label="${l.name} Helligkeit"`)}<div class="row color-controls">${field('Lichtfarbe',`<input type="color" value="${l.color}" data-change="${draft?'scene-color':'color'}" data-id="${l.id}">`)}${field('Weißton',`<select data-change="${draft?'scene-kelvin':'kelvin'}" data-id="${l.id}">${options([['2200','Kerzenwarm'],['2700','Warmweiß'],['4000','Neutralweiß'],['5500','Tageslicht']],String(l.kelvin))}</select>`)}</div>`}</article>`;}
function sceneEditor(){const d=state.sceneDraft;return `<section class="card" data-testid="scene-editor"><h2>Neue Szene</h2><h3>1. Lampen einstellen</h3><div class="stack">${d.lights.map(l=>lampEditor(l,true)).join('')}</div>${field('2. Szenenname',`<input id="snapshot-name" data-input="scene-name" value="${esc(d.name)}" placeholder="Mein Licht" maxlength="60">`)}<div class="actions">${btn('Szene speichern','snapshot',`data-id="${d.target}" data-testid="save-scene"`,'primary')}${btn('Abbrechen','scene-cancel','data-testid="cancel-scene"')}</div></section>`;}
function sceneTile(p,id){return `<article class="card"><button class="palette-button" data-action="apply" data-id="${id}" data-type="scene" data-scene="${p.name}"><div class="palette" style="--gradient:${p.gradient}"></div>${p.name}</button>${btn(state.favorites.includes(p.name)?'★ Favorit':'☆ Favorit','favorite',`data-name="${p.name}"`,'quiet small')}</article>`;}
function advancedRoom(id){const cfg=state.settings[id]||{};return `<h3>Raumverhalten</h3>${field('Beim Einschalten',`<select data-change="setting" data-id="${id}" data-key="defaultOn">${options([['last','Letzter Zustand'],['scene','Lieblingsszene']],cfg.defaultOn||'last')}</select>`)}${field('Szenenfolge',`<select data-change="setting" data-id="${id}" data-key="cycle">${options([['ab','Abend → Morgentau'],['ba','Morgentau → Abend']],cfg.cycle||'ab')}</select>`)}${state.al?`<h3>Natürliches Licht · optionale Demo</h3>${btn('Natürliches Licht an','apply',`data-id="${id}" data-type="naturalon"`)} ${btn('Natürliches Licht aus','apply',`data-id="${id}" data-type="naturaloff"`)}`:''}<h3>Lampen anordnen</h3>${field('Lampe',`<select id="position-lamp">${options(lamps(id).map(l=>[l.id,l.name]),lamps(id)[0]?.id)}</select>`)}<div class="position-grid">${Array.from({length:9},(_,i)=>btn(['Vorne links','Vorne Mitte','Vorne rechts','Mitte links','Mitte','Mitte rechts','Hinten links','Hinten Mitte','Hinten rechts'][i],'position',`data-id="${id}" data-cell="${i}"`,'small')).join('')}</div>${field('Höhe','<select id="position-height"><option>Boden</option><option>Möbelhöhe</option><option>Hintergrund</option><option>Decke</option></select>')}${btn('Position entfernen','position-remove',`data-id="${id}"`)}<p class="hint">${esc(Object.entries(state.positions[id]||{}).map(([l,p])=>`${name(l)}: Feld ${p.cell+1}, ${p.height}`).join(' · ')||'Noch keine Position zugewiesen.')}</p><h3>Bewegung</h3><label class="check"><input type="checkbox" id="motion-enabled" ${cfg.motion?'checked':''}>Bewegungsautomatik aktiv</label>${field('Beispiel-Sensor','<select id="motion-sensor"><option>Bewegungssensor · Beispieldaten</option></select>')}${field('Nachlauf (Sekunden)',`<input type="number" id="motion-delay" min="1" max="86400" value="${cfg.delay||180}">`)}${field('Aktion','<select id="motion-action"><option>Nachtlicht</option><option>Szene Abend</option></select>')}<label class="check"><input type="checkbox" id="motion-dim">20 Sekunden vorher abdunkeln</label><h3>Grundhelligkeit</h3><label class="check"><input type="checkbox" id="base-enabled" ${cfg.base?'checked':''}>Grundhelligkeit aktiv</label>${field('Helligkeitssensor','<select><option>Helligkeit · Beispieldaten</option></select>')}<div class="split">${field('Ziel (Lux)',`<input type="number" id="base-lux" value="${cfg.lux||150}" min="1">`)}${field('Hysterese (Lux)','<input type="number" id="base-hysteresis" value="20" min="0">')}</div>${field('Mindestabstand (Sekunden)','<input type="number" id="base-interval" value="180" min="1">')}<p class="hint">Stufe 1: erste dimmbare Lampe · 35 %. Stufe 2: übrige freigegebene Lampen · 65 %. Schalter nur Ein/Aus.</p>${field('Stufe 1 Helligkeit',range('stage-one',cfg.stage||35,'readout'))}<div class="split">${field('Zeitfenster von','<input type="time" id="rule-from" value="16:00">')}${field('bis','<input type="time" id="rule-to" value="23:00">')}</div><label class="check"><input type="checkbox" id="rule-presence">Nur bei Anwesenheit · Beispielperson</label>${btn('Regeln in Vorschau übernehmen','rules-save',`data-id="${id}"`,'primary')}<p class="hint" data-testid="rules-summary">${cfg.summary?esc(cfg.summary):'Lernwert: unbekannt · keine echte Sensormessung.'}</p><p class="notice">Der Editor zeigt den vorgesehenen Platz für die bestehenden Regeln. Sensorprüfung, Stufenbesitz, Eigenlicht-Lernen und Abschaltfehler werden erst in Phase 2 angebunden.</p>`;}
function gallery(){return `${state.palette?paletteEditor():`<div class="eyebrow">Farben sammeln</div><h1>Deine Lichtmomente.</h1><p class="muted">Eigene Paletten. Für ruhige Abende und neue Ideen.</p><h2>Unsere Farbpaletten</h2><div class="grid">${palettes.map((p,i)=>`<article class="card"><button class="palette-button" data-action="palette" data-index="${i}" data-testid="palette-${i}"><div class="palette" style="--gradient:${p.gradient}"></div>${p.name}<p class="hint">Palette entdecken ↗</p></button></article>`).join('')}</div><details><summary>Mehr Optionen</summary><h3>Eigene Palette erstellen</h3>${field('Name','<input id="custom-palette-name" placeholder="Meine Farben">')}<div class="row">${field('Erste Farbe','<input id="custom-color-one" type="color" value="#bc9275">')}${field('Zweite Farbe','<input id="custom-color-two" type="color" value="#91a58e">')}</div>${btn('Palette in Vorschau ergänzen','palette-create')}<h3>Szenen der Bridge</h3><p class="hint">Import vorhandener Bridge-Szenen bleibt hier erreichbar. In dieser offline Vorschau ist keine Bridge verbunden.</p></details>`}`;}
function paletteEditor(){const p=palettes[state.palette-1];return `${btn('← Farben','gallery-back','','quiet back')}<div class="eyebrow">Farbpalette</div><h1>${esc(p.name)}</h1><div class="palette" style="height:180px;--gradient:${p.gradient}"></div><section class="card">${field('Wo soll das Licht leuchten?',`<select id="palette-target" data-testid="palette-target">${groupOptions('z1')}</select>`)}${field('Helligkeit',range('palette-bri',65,'readout'))}<label class="check"><input id="palette-save" type="checkbox">Als eigene Szene im Ziel ablegen</label><details><summary>Mehr Optionen</summary><label class="check"><input type="checkbox" id="palette-dynamic">Farben langsam wechseln</label>${field('Verteilung','<select id="palette-distribution"><option>Zufällig</option><option>Links → rechts</option><option>Vorne → hinten</option><option>Nach Höhe</option></select>')}<label class="check"><input type="checkbox" id="palette-wave">Welle durch den Raum</label><div class="split">${field('Wechsel alle (Sekunden)','<input type="number" id="palette-interval" min="1" value="60">')}${field('Übergang (Sekunden)','<input type="number" id="palette-transition" min="0" max="1800" value="10">')}</div></details>${btn('In Vorschau anwenden','palette-apply','data-testid="apply-palette"','primary full')}<p class="hint">Paletten ändern nur Lampen. Reine Lichtschalter bleiben unverändert. Dynamik wird als Zustand dargestellt, nicht zeitgesteuert abgespielt.</p></section>`;}
function triggerSentence(a){if(a.trigger==='clock')return `${a.time} Uhr`;if(a.trigger==='lux')return `Helligkeit unter ${a.lux||80} Lux für 5 Minuten`;const sun=a.trigger==='sunrise'?'Sonnenaufgang':'Sonnenuntergang';return Number(a.offset)===0?sun:`${Math.abs(a.offset)} Min. ${a.offset<0?'vor':'nach'} ${sun}`;}
function actionSentence(a){return `${a.targets.map(name).join(', ')} → ${a.type==='scene'?'Szene '+a.scene:a.type==='brightness'?a.bri+' %':actionNames[a.type]}`;}
function automationSentence(a){return `${triggerSentence(a)} · ${a.actions.map(actionSentence).join(' · ')}`;}
function automations(){return state.wizard?wizard():`<div class="eyebrow">Im richtigen Moment</div><h1>Das Licht denkt mit.</h1><p class="muted">Deine Abläufe, verständlich in einem Satz.</p>${btn('+ Neue Automation','automation-new','data-testid="new-automation"','primary full')}<div class="stack" style="margin-top:20px">${state.automations.map(a=>`<article class="card" data-testid="automation-${a.id}"><div class="row automation-heading"><strong>${esc(automationSentence(a))}</strong>${btn(`<span aria-hidden="true" class="switch-thumb"></span>`,'automation-toggle',`data-id="${a.id}" data-testid="toggle-${a.id}" role="switch" aria-checked="${a.enabled}" aria-label="Automation ${esc(automationSentence(a))} aktiv"`,'automation-switch')}</div><p class="hint">${a.days.length===7?'Jeden Tag':a.days.map(i=>days[i]).join(', ')} · ${a.enabled?'In Vorschau aktiv':'Pausiert'}</p><p class="hint">Nächste Ausführung: nur Demo, keine echte Sonnen- oder Kalenderberechnung.</p><div class="actions">${btn('Jetzt testen','automation-test',`data-id="${a.id}" data-testid="test-${a.id}"`)}${btn('Bearbeiten','automation-edit',`data-id="${a.id}"`,'quiet')}${btn('Entfernen','automation-delete',`data-id="${a.id}"`,'quiet danger')}</div></article>`).join('')}</div><p class="notice">„Jetzt testen“ verändert ausschließlich die Beispieldaten und den heutigen Demo-Automatik-Stand.</p>`;}
function freshWizard(){return {id:null,step:1,trigger:'sunset',offset:-15,time:'22:30',days:[0,1,2,3,4,5,6],targets:[],actions:[{targets:[],type:'scene',scene:'Abend',bri:50}],conditions:{}};}
function wizard(){const w=state.wizard;return `${btn('← Automationen','wizard-cancel','','quiet back')}<div class="eyebrow">${w.id?'Automation bearbeiten':'Neue Automation'}</div><h1>${['','Wann geht’s los?','Wo wird es hell?','Was soll passieren?'][w.step]}</h1><div class="steps">${['Wann','Wo','Was'].map((s,i)=>`<span class="${w.step===i+1?'current':''}">${i+1} · ${s}</span>`).join('')}</div><section class="card" data-testid="wizard-step-${w.step}">${w.step===1?whenStep(w):w.step===2?`<p>Wähle Räume, Zonen oder einzelne Lampen. Mehrfachauswahl ist möglich.</p>${checks(w.targets,'wizard-target','data-testid="wizard-target"')}<p class="hint">Diese Ziele gelten für die erste Aktion. Weitere Aktionen erhalten ihre eigene Zielauswahl.</p>`:whatStep(w)}</section><div class="actions">${w.step>1?btn('Zurück','wizard-prev'):''}${btn(w.step===3?'In Vorschau speichern':'Weiter','wizard-next',`data-testid="wizard-next"`,'primary')}</div><p class="hint">Nur im Arbeitsspeicher dieser Seite. Neuladen verwirft alle Änderungen.</p>`;}
function whenStep(w){return `${field('Auslöser',`<select data-change="wizard-field" data-key="trigger" id="trigger" data-testid="trigger">${options([['sunset','Sonnenuntergang'],['sunrise','Sonnenaufgang'],['clock','Uhrzeit']],w.trigger==='lux'?'sunset':w.trigger)}</select>`)}${w.trigger==='clock'?field('Uhrzeit',`<input type="time" data-change="wizard-field" data-key="time" value="${w.time}" id="trigger-time">`):w.trigger==='lux'?field('Unter (Lux)',`<input type="number" min="1" data-change="wizard-field" data-key="lux" value="${w.lux||80}">`):`<p class="hint">Minuten vor oder nach dem Sonnenereignis</p><div class="chips">${[-30,-20,-15,-10,0,10,15,20,30].map(n=>btn(n>0?'+'+n:String(n),'offset',`data-offset="${n}" data-testid="offset-${n}" aria-pressed="${Number(w.offset)===n}"`,'chip')).join('')}</div>${field('Oder frei eingeben (−1440 bis +1440 Minuten)',`<input type="number" min="-1440" max="1440" value="${w.offset}" data-change="wizard-field" data-key="offset" id="free-offset">`)}`}<details ${w.trigger==='lux'?'open':''}><summary>Mehr Optionen</summary><label class="check"><input type="checkbox" data-change="lux-trigger" ${w.trigger==='lux'?'checked':''}>Helligkeit als Auslöser verwenden</label><p class="hint">Lux-Schwelle mit fünf Minuten Mindestdauer; nur als Demo konfigurierbar.</p></details><h3>Wochentage</h3><div class="chips">${days.map((d,i)=>btn(d,'weekday',`data-day="${i}" aria-pressed="${w.days.includes(i)}"`,'chip')).join('')}</div>`;}
function whatStep(w){return `<p class="hint">Aktionen laufen nacheinander von oben nach unten. Bei überlappenden Zielen gilt die spätere Aktion.</p><div class="stack">${w.actions.map((a,i)=>`<section><div class="row"><h3>Aktion ${i+1}</h3>${i>0?btn('Entfernen','action-remove',`data-index="${i}"`,'quiet danger'):''}</div>${field('Aktion',`<select data-change="action-field" data-index="${i}" data-key="type" data-testid="action-type-${i}">${actionOptions(a.type)}</select>`)}${a.type==='scene'?field('Szene',`<select data-change="action-field" data-index="${i}" data-key="scene">${options(palettes.map(p=>[p.name,p.name]),a.scene)}</select>`):''}${a.type==='brightness'?field('Helligkeit (%)',`<input type="number" min="1" max="100" value="${a.bri}" data-change="action-field" data-index="${i}" data-key="bri">`):''}${i===0?`<p data-testid="primary-targets">Ziele aus Schritt 2: ${esc(a.targets.map(name).join(', '))}</p>`:`<details ${a.targets.length?'':'open'}><summary>Ziele: ${esc(a.targets.map(name).join(', ')||'Bitte wählen')}</summary>${checks(a.targets,'action-target',`data-index="${i}"`)}</details>`}</section>`).join('')}</div>${btn('+ Weitere Aktion','action-add','data-testid="add-action"','quiet')}<details><summary>Mehr Optionen</summary>${field('Übergang (Sekunden)',`<input type="number" id="automation-transition" min="0" max="1800" value="${w.conditions.transition||0}" data-change="condition" data-key="transition">`)}<label class="check"><input type="checkbox" data-change="condition" data-key="presence" ${w.conditions.presence?'checked':''}>Nur wenn Beispielperson zu Hause ist</label>${field('Lichtzustand',`<select data-change="condition" data-key="light">${options([['any','Egal'],['on','Mindestens ein Ziel an'],['off','Alle Ziele aus']],w.conditions.light||'any')}</select>`)}${field('Nur unter (Lux, leer = keine Bedingung)',`<input type="number" min="0" data-change="condition" data-key="lux" value="${esc(w.conditions.lux||'')}">`)}<div class="split">${field('Zeitfenster von',`<input type="time" data-change="condition" data-key="from" value="${esc(w.conditions.from||'')}">`)}${field('bis',`<input type="time" data-change="condition" data-key="to" value="${esc(w.conditions.to||'')}">`)}</div><p class="hint">Bedingungen werden im Entwurf aufbewahrt, nicht gegen echte Sensoren geprüft.</p></details>`;}
function devices(){const names=['Hue Dimmer','Tap Dial','Wandschalter-Modul','Shelly'];return state.device?deviceEditor():`<div class="eyebrow">Mit einem Handgriff</div><h1>Dein Licht.<br>Deine Tasten.</h1><p class="muted">Tippe auf ein Gerät und dann auf seine Taste.</p><div class="grid device-grid">${names.map((n,i)=>`<article class="card"><h3>${n}</h3>${deviceDrawing(n,false)}${btn('Belegen ↗','device',`data-device="${n}" data-testid="device-${i}"`,'quiet')}</article>`).join('')}</div><details><summary>Mehr Optionen · Zigbee2MQTT</summary><p class="hint">Automatische Erkennung echter Geräte folgt in Phase 2. Hier kannst du das Anlernen mit einem gemeinsamen Beispiel-Ereignis ausprobieren.</p>${capturePanel()}</details>`;}
function deviceDrawing(n,interactive){const labels=n==='Hue Dimmer'?['An','Hoch','Runter','Hue','Aus']:n==='Tap Dial'?['1','2','3','4']:n==='Shelly'?['Taste']:['Links','Rechts'];const style=n==='Tap Dial'?'dial':n==='Wandschalter-Modul'?'wall':n==='Shelly'?'shelly':'';return `<div class="device ${style}" aria-label="Zeichnung ${n}">${labels.map(t=>btn(t,interactive?'physical-button':'device',`data-device="${n}" data-button="${t}" aria-label="${n} ${t}"`)).join('')}</div>`;}
function bindingKey(){return `${state.device}|${state.button}|${state.event}`;}
function defaultBinding(){const type=state.button==='An'?'full':state.button==='Hue'?'nightauto':state.button==='Hoch'?'up':state.button==='Runter'?'down':state.button==='Aus'?'off':'toggle';return {type,targets:['z1'],scene:'Abend',bri:50};}
function deviceEditor(){const b=state.bindings[bindingKey()]||defaultBinding();return `${btn('← Taster','device-back','','quiet back')}<div class="eyebrow">Taster belegen</div><h1>${state.device}</h1>${deviceDrawing(state.device,true)}<p class="hint" style="text-align:center">Taste antippen, dann ihre Aktion wählen.</p><section class="card"><h3>Taste ${state.button}</h3><div class="chips">${['Kurz drücken','Lang drücken',...(state.device==='Tap Dial'?['Drehen nach links','Drehen nach rechts']:[])].map(e=>btn(e,'event',`data-event="${e}" aria-pressed="${e===state.event}"`,'chip')).join('')}</div>${field('Was soll passieren?',`<select id="binding-action" data-change="binding-action" data-testid="binding-action">${actionOptions(b.type)}</select>`)}${b.type==='scene'?field('Szene',`<select id="binding-scene" data-change="binding-scene">${options(palettes.map(p=>[p.name,p.name]),b.scene)}</select>`):''}<h3>Wo?</h3>${checks(b.targets,'binding-target','data-testid="binding-target"')}<div class="actions">${btn('Belegung in Vorschau merken','binding-save','data-testid="save-binding"','primary')}${btn('Taste ausprobieren','binding-test','data-testid="test-binding"')}</div><p class="status" data-testid="binding-summary">${esc(`${state.button} · ${state.event} · ${actionSentence(b)}`)}</p></section>${state.device==='Hue Dimmer'?`<section class="card" style="margin-top:14px"><h3>Vorlage für den Dimmer</h3><p class="hint">An: 100 % · neutrales Weiß<br>Hue: Nachtlicht ⇄ Automatik<br>Hoch / Runter: Helligkeit ±10 %<br>Aus: Licht ausschalten</p>${field('Ziel für die Vorlage',`<select id="template-target">${groupOptions('z1')}</select>`)}${btn('Dimmer-Vorlage übernehmen','template','data-testid="dimmer-template"')}<p class="hint">Danach kann jede Taste auch einzelne Lampen steuern.</p></section>`:''}<details><summary>Mehr Optionen · Taste anlernen</summary>${capturePanel()}${field('Doppelklick-Zeit (Millisekunden)','<input type="number" min="100" max="1000" value="500" id="double-time">')}${btn('Doppelklick-Zeit in Vorschau merken','double-save')}<p class="hint">Für Hue nur bei einer eigenen Doppelklick-Belegung vorgesehen.</p></details>`;}
function capturePanel(){return `${field('Beispiel-Ereignis','<select id="capture-kind"><option value="2">Taste 2 · kurz drücken</option><option value="1">Taste 1 · kurz drücken</option><option value="right">Drehen nach rechts</option><option value="unknown">Unbekanntes Ereignis</option></select>')}${btn('Taste anlernen · simulieren','capture','data-testid="capture-event"')}<div data-testid="capture-result">${state.capture?`<p class="status"><strong>${state.capture.label}</strong><br>Ein gemeinsames Beispiel-Ereignis · Typ: ${esc(state.capture.type)}<br>Attribute: ${esc(JSON.stringify(state.capture.attrs))}</p>${btn('Ereignis in Vorschau belegen','capture-bind')}`:''}</div><p class="hint">Nicht nur der Ereignistyp zählt: Taste, Richtung und weitere Attribute unterscheiden die Belegungen. Die echten Attributnamen werden in Phase 2 aus dem Gerät gelesen.</p>${state.captured.map(c=>`<p class="hint">✓ ${esc(c.label)} · ${esc(c.type)} · ${esc(JSON.stringify(c.attrs))}</p>`).join('')}`;}
function more(){return `<div class="eyebrow">Gut eingerichtet</div><h1>Alles findet<br>seinen Platz.</h1><section class="card"><h3>Ein Entwurf zum Ausprobieren</h3><p class="muted">Alle Änderungen bleiben nur hier, bis du die Seite neu lädst oder zurücksetzt.</p><p class="notice">Phase 2 speichert nach Freigabe serverseitig im Home-Assistant-Store. Dieser Entwurf speichert nicht dauerhaft und verbindet sich mit keinem Gerät.</p>${btn('Demo vollständig zurücksetzen','reset','data-testid="reset-demo"')}${btn('Neuen Tag simulieren','new-day','data-testid="new-day"','quiet')}<p class="hint">Ein neuer Tag löscht nur den heutigen Automatik-Stand.</p></section><h2>Lampen freigeben</h2><section class="card"><p class="hint">Nur ausdrücklich freigegebene Beispiel-Lichter werden bedient. Deckenlicht ist ein reiner Schalter.</p>${state.lights.map(l=>`<label class="check"><input type="checkbox" data-change="grant" data-id="${l.id}" ${l.grant?'checked':''}>${l.name} · ${name(l.room)}</label>`).join('')}</section><details data-testid="optional-options"><summary>Mehr Optionen</summary><label class="check"><input type="checkbox" data-change="al" data-testid="optional-al" ${state.al?'checked':''}>Optionale Integration in der Demo zeigen</label><p class="hint">Adaptive Lighting ist aktuell nicht vorhanden. Ohne diese Integration bleiben die entsprechenden Aktionen ausgeblendet. Dieser Schalter simuliert nur ihre Verfügbarkeit.</p>${state.al?'<p class="status">Natürliches Licht ist jetzt in den erweiterten Raumoptionen und Aktionslisten sichtbar.</p>':''}</details><h2>Wo finde ich was?</h2><section class="card"><div class="stack">${[['Räume und Zonen','Zuhause · direkt schalten und dimmen'],['Szenen und Momentaufnahmen','Zuhause → Raum oder Zone'],['Paletten und räumliche Dynamik','Farben → Palette → Mehr Optionen'],['Positionen und Szenenfolge','Zuhause → Raum → Mehr Optionen'],['Bewegung und Grundhelligkeit','Zuhause → Raum → Mehr Optionen'],['Zeitpläne und Bedingungen','Automationen → Neue Automation'],['Taster und Einzellampen-Ziele','Taster → Gerät'],['Freigaben und optionale Integration','Mehr']].map(([a,b])=>`<div><strong>${a}</strong><div class="hint">${b}</div></div>`).join('')}</div></section><h2>Demo-Protokoll</h2><section class="card" data-testid="demo-log">${state.logs.length?`<ul class="log">${state.logs.slice(0,15).map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:'<p class="hint">Hier erscheinen simulierte Aktionen und Hinweise.</p>'}</section>`;}
function snapshot(id){return lamps(id).map(l=>clone(l));}
function restore(items){items.forEach(item=>{const l=light(item.id);if(l?.grant)Object.assign(l,clone(item));});}
function apply(id,type,scene='Abend',bri=50,automated=false){
 const ls=lamps(id);let label=actionNames[type];
 if(!ls.length){log(`${name(id)}: keine freigegebenen Lichter.`);return;}
 if(type==='nightauto')type=state.current[id]==='Nachtlicht'?'auto':'night';
 if(type==='auto'){
  const saved=state.automatic[id];if(!saved){log(`${name(id)}: kein Automatik-Stand für heute. Licht bleibt unverändert.`);return;}
  restore(saved.lights);state.current[id]=saved.label;log(`${name(id)}: zurück zu ${saved.label} · nur Demo`);return;
 }
 if(type==='next'){const cycle=state.settings[id]?.cycle==='ba'?['Morgentau','Abend']:['Abend','Morgentau'];scene=cycle[(cycle.indexOf(state.current[id])+1)%cycle.length];type='scene';}
 if(type==='toggle')type=on(id)?'off':'on';
 if(['scene','night','brightness','full','up','down'].includes(type)&&!ls.some(l=>!l.switch)){log(`${name(id)}: nur Lichtschalter. Diese Aktion verändert keinen Schalter.`);return;}
 if(type==='scene'){
  const p=palettes.find(p=>p.name===scene)||palettes[0];ls.filter(l=>!l.switch).forEach((l,i)=>{l.on=true;l.bri=Number(bri);l.color=p.colors[i%p.colors.length];});label=scene;
 }else if(type==='night'){
  ls.filter(l=>!l.switch).forEach(l=>{l.on=true;l.bri=state.night[id]?.bri||12;l.kelvin=2200;});label='Nachtlicht';
 }else if(type==='off'||type==='on'){ls.forEach(l=>l.on=type==='on');label=type==='off'?'Aus':'An';
 }else if(['brightness','full','up','down'].includes(type)){
  ls.filter(l=>!l.switch).forEach(l=>{l.on=true;l.bri=type==='up'?Math.min(100,l.bri+10):type==='down'?Math.max(1,l.bri-10):type==='full'?100:Number(bri);if(type==='full')l.kelvin=4000;});label=type==='full'?'100 % · neutrales Weiß':type==='brightness'?`${bri} %`:'Individuell';
 }else if(type==='stop'){state.dynamic[id]=false;label=state.current[id]||'Individuell';
 }else if(type.startsWith('motion')){state.settings[id]??={};state.settings[id].motion=type==='motionon';label=state.current[id]||'Individuell';
 }else if(type.startsWith('natural')){if(!state.al)return;label=type==='naturalon'?'Natürliches Licht':'Natürliches Licht pausiert';}
 state.groups.filter(g=>g.id!==id&&g.lights.some(l=>ls.some(x=>x.id===l))).forEach(g=>state.current[g.id]='Individuell');
 state.current[id]=label;if(automated)state.automatic[id]={label,lights:snapshot(id)};
 log(`${name(id)}: ${label} · ${automated?'Automatik-Test':'Handbedienung'} · nur Demo`);
}
function render(){
 const view=[state.tab,state.detail,state.device,state.palette,state.wizard?.step,state.zoneForm,!!state.sceneDraft].join('|');
 const openDetails=renderedView===view?[...document.querySelectorAll('#app details')].map((el,i)=>el.open?i:-1):[];
 renderedView=view;
 $('app').innerHTML=state.tab==='home'?(state.detail?detail():home()):state.tab==='scenes'?gallery():state.tab==='automations'?automations():state.tab==='buttons'?devices():more();
 [...document.querySelectorAll('#app details')].forEach((el,i)=>{if(openDetails.includes(i))el.open=true;});
 $('tabs').innerHTML=[['home','⌂','Zuhause'],['scenes','◒','Farben'],['automations','◷','Automationen'],['buttons','▥','Taster'],['more','•••','Mehr']].map(([id,icon,label])=>`<button data-action="nav" data-tab="${id}" data-testid="nav-${id}" class="${state.tab===id?'active':''}" ${state.tab===id?'aria-current="page"':''}><span aria-hidden="true" class="tab-icon">${icon}</span>${label}</button>`).join('');
}
function toggleList(list,value,checked){return checked?[...new Set([...list,value])]:list.filter(x=>x!==value);}
function rememberBinding(){const key=bindingKey();if(!state.bindings[key])state.bindings[key]=clone(defaultBinding());return state.bindings[key];}
function validateWizard(){const w=state.wizard;if(w.step===1){if(!w.days.length)return 'Bitte mindestens einen Wochentag wählen.';if(w.trigger==='clock'&&!/^\d\d:\d\d$/.test(w.time))return 'Bitte eine Uhrzeit wählen.';if(!Number.isFinite(Number(w.offset))||Math.abs(Number(w.offset))>1440)return 'Bitte einen Versatz zwischen −1440 und +1440 Minuten eingeben.';}if(w.step===2&&!w.targets.length)return 'Bitte mindestens ein Ziel wählen.';if(w.step===3){if(w.actions.some(a=>!a.targets.length))return 'Jede Aktion braucht mindestens ein Ziel.';if(w.actions.some(a=>a.type==='brightness'&&(!Number.isFinite(Number(a.bri))||a.bri<1||a.bri>100)))return 'Helligkeit muss zwischen 1 und 100 % liegen.';}return '';}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;const d=b.dataset,id=d.id,a=d.action;
 if(a==='nav'){navigate(d.tab);return;}
 if(a==='detail'){state.sceneDraft=null;state.detail=id;render();window.scrollTo?.(0,0);return;}
 if(a==='back'){state.detail=null;state.sceneDraft=null;}
 if(a==='power')apply(id,on(id)?'off':'on');
 if(a==='apply')apply(id,d.type,d.scene);
 if(a==='zone-new')state.zoneForm=true;
 if(a==='zone-cancel')state.zoneForm=false;
 if(a==='zone-save'){
  const title=$('zone-name').value.trim(),ls=[...document.querySelectorAll('[name="zone-lamp"]:checked')].map(x=>x.value);
  if(!title||!ls.length){notify('Bitte einen Namen und mindestens eine Lampe wählen.');return;}
  state.groups.push({id:'z'+Date.now(),name:title,kind:'Zone',lights:ls});state.zoneForm=false;notify('Zone in der Vorschau angelegt.');
 }
 if(a==='night-save'){state.night[id]={name:$('night-name').value.trim()||'Leiser Abend',bri:Number($('night-bri').value)};notify('Nachtlicht für dieses Ziel im Entwurf geändert.');}
 if(a==='favorite')state.favorites=toggleList(state.favorites,d.name,!state.favorites.includes(d.name));
 if(a==='snapshot'){const draft=state.sceneDraft;if(!draft)return;const title=$('snapshot-name').value.trim();if(!title){notify('Bitte einen Szenennamen eingeben.');return;}if(draft){state.scenes.push({id:'s'+Date.now(),name:title,target:draft.target,kind:'Momentaufnahme',lights:clone(draft.lights)});state.sceneDraft=null;notify('Szene nur im Entwurf abgelegt.');}}
 if(a==='scene-new')state.sceneDraft={target:id,name:'',lights:clone(lamps(id))};
 if(a==='scene-cancel')state.sceneDraft=null;
 if(a==='scene-power'){const l=state.sceneDraft.lights.find(l=>l.id===id);l.on=!l.on;}
 if(a==='automation-toggle'){const plan=state.automations.find(p=>p.id===id);plan.enabled=!plan.enabled;}
 if(a==='snapshot-apply'){const s=state.scenes.find(s=>s.id===id);restore(s.lights);state.current[s.target]=s.name;notify('Momentaufnahme in der Demo aktiviert.');}
 if(a==='position'){const l=$('position-lamp').value;state.positions[id]??={};state.positions[id][l]={cell:Number(d.cell),height:$('position-height').value};notify('Position im Entwurf gesetzt.');}
 if(a==='position-remove'){delete (state.positions[id]||{})[$('position-lamp').value];notify('Position im Entwurf entfernt.');}
 if(a==='rules-save'){
  state.settings[id]??={};Object.assign(state.settings[id],{motion:$('motion-enabled').checked,delay:Number($('motion-delay').value),base:$('base-enabled').checked,lux:Number($('base-lux').value),stage:Number($('stage-one').value),summary:`Bewegung ${$('motion-enabled').checked?'an':'aus'} · Nachlauf ${$('motion-delay').value} s · Grundhelligkeit ${$('base-enabled').checked?'an':'aus'} · Ziel ${$('base-lux').value} Lux · Zeitfenster ${$('rule-from').value}–${$('rule-to').value} · nur Demo`});notify('Regelentwurf übernommen. Keine Automatik läuft wirklich.');
 }
 if(a==='palette')state.palette=Number(d.index)+1;
 if(a==='gallery-back')state.palette=null;
 if(a==='palette-create'){
  const title=$('custom-palette-name').value.trim();if(!title){notify('Bitte einen Namen eingeben.');return;}
  const colors=[$('custom-color-one').value,$('custom-color-two').value];palettes.push({name:title,colors,gradient:`linear-gradient(125deg,${colors.join(',')})`});notify('Eigene Palette im Entwurf ergänzt.');
 }
 if(a==='palette-apply'){
  const target=$('palette-target').value,p=palettes[state.palette-1],bri=Number($('palette-bri').value);apply(target,'scene',p.name,bri);
  state.dynamic[target]=$('palette-dynamic').checked?{distribution:$('palette-wave').checked&&$('palette-distribution').value==='Zufällig'?'Links → rechts':$('palette-distribution').value,wave:$('palette-wave').checked,interval:Number($('palette-interval').value),transition:Number($('palette-transition').value)}:false;
  if($('palette-save').checked)state.scenes.push({id:'s'+Date.now(),name:p.name,target,kind:'Palette',lights:snapshot(target),dynamic:clone(state.dynamic[target])});notify('Palette in der Vorschau angewendet. Schalter bleiben unverändert.');
 }
 if(a==='automation-new')state.wizard=freshWizard();
 if(a==='automation-edit'){const plan=state.automations.find(p=>p.id===id);state.wizard={...freshWizard(),...clone(plan),step:1,targets:[...plan.actions[0].targets]};}
 if(a==='automation-delete')state.automations=state.automations.filter(p=>p.id!==id);
 // Each action finishes synchronously before the next starts; later actions win on shared lamps.
 if(a==='automation-test'){const plan=state.automations.find(p=>p.id===id);for(const action of plan.actions){for(const target of action.targets){apply(target,action.type,action.scene,action.bri,true);}}notify('Automation simuliert. Demo-Stand gesetzt; Bedingungen und nächste Ausführung nicht berechnet.');}
 if(a==='wizard-cancel')state.wizard=null;
 if(a==='wizard-prev')state.wizard.step--;
 if(a==='wizard-next'){
  const error=validateWizard();if(error){notify(error);return;}
  const w=state.wizard;if(w.step<3){if(w.step===2)w.actions[0].targets=[...w.targets];w.step++;}else{const plan=clone(w);plan.id||='a'+Date.now();plan.enabled=plan.enabled||false;delete plan.step;delete plan.targets;const index=state.automations.findIndex(p=>p.id===plan.id);if(index<0)state.automations.push(plan);else state.automations[index]=plan;state.wizard=null;notify('Automation im Entwurf abgelegt. Neue Automationen starten pausiert.');}
 }
 if(a==='offset')state.wizard.offset=Number(d.offset);
 if(a==='weekday'){const i=Number(d.day);state.wizard.days=toggleList(state.wizard.days,i,!state.wizard.days.includes(i)).sort();}
 if(a==='action-add')state.wizard.actions.push({targets:[],type:'off',scene:'Abend',bri:50});
 if(a==='action-remove'&&Number(d.index)>0)state.wizard.actions.splice(Number(d.index),1);
 if(a==='device'){state.device=d.device;state.button=d.button||'An';state.event='Kurz drücken';}
 if(a==='device-back')state.device=null;
 if(a==='physical-button'){state.button=d.button;state.event='Kurz drücken';}
 if(a==='event')state.event=d.event;
 if(a==='binding-save'){const binding=rememberBinding();if(!binding.targets.length){notify('Bitte mindestens ein Ziel wählen.');return;}if(binding.type==='scene')binding.scene=$('binding-scene').value;notify('Tastenbelegung in der Vorschau gemerkt.');}
 if(a==='binding-test'){const binding=rememberBinding();binding.targets.forEach(target=>apply(target,binding.type,binding.scene,binding.bri));}
 if(a==='template'){const target=$('template-target').value;Object.entries({An:'full',Hue:'nightauto',Hoch:'up',Runter:'down',Aus:'off'}).forEach(([key,type])=>state.bindings[`Hue Dimmer|${key}|Kurz drücken`]={type,targets:[target],scene:'Abend',bri:50});notify('Alle fünf Dimmer-Tasten für '+name(target)+' im Entwurf belegt.');}
 if(a==='capture'){
  const v=$('capture-kind').value;state.capture=v==='unknown'?{source:'demo-event',type:'experimental_click',attrs:{code:9},label:'experimental_click'}:v==='right'?{source:'demo-event',type:'dial_rotate',attrs:{direction:'right',speed:1},label:'Drehen nach rechts'}:{source:'demo-event',type:'press_release',attrs:{button:Number(v)},label:`Taste ${v} · kurz drücken`};
 }
 if(a==='capture-bind'){const c=clone(state.capture);const key=JSON.stringify([c.source,c.type,c.attrs]);if(!state.captured.some(x=>x.key===key))state.captured.push({...c,key});state.bindings[key]={type:'toggle',targets:['z1'],scene:'Abend',bri:50};notify(`${c.label}: eigenes Muster → Wohnbereich Ein / Aus · Demo`);}
 if(a==='double-save')notify('Doppelklick-Zeit '+$('double-time').value+' ms im Entwurf gewählt.');
 if(a==='new-day'){state.automatic={};log('Neuer Demo-Tag: Automatik-Stand für alle Ziele gelöscht.');}
 if(a==='reset'){state=initial();palettes.splice(4);notify('Alle Beispieldaten zurückgesetzt.');}
 render();
});
document.addEventListener('input',e=>{if(e.target.dataset.input==='scene-name'&&state.sceneDraft)state.sceneDraft.name=e.target.value;});
document.addEventListener('change',e=>{
 const el=e.target,d=el.dataset,a=d.change,id=d.id;if(!a)return;
 if(a?.startsWith('scene-')&&state.sceneDraft){const l=state.sceneDraft.lights.find(l=>l.id===id);if(l&&!l.switch){if(a==='scene-brightness'){l.bri=Number(el.value);l.on=true;}if(a==='scene-color')l.color=el.value;if(a==='scene-kelvin')l.kelvin=Number(el.value);}}
 if(a==='brightness')apply(id,'brightness','Abend',Number(el.value));
 if(a==='color'){light(id).color=el.value;state.current[light(id).room]='Individuell';}
 if(a==='kelvin')light(id).kelvin=Number(el.value);
 if(a==='grant')light(id).grant=el.checked;
 if(a==='al'){state.al=el.checked;notify(state.al?'Optionale Integration nur für diese Demo eingeblendet.':'Optionale Integration ausgeblendet.');}
 if(a==='setting'){state.settings[id]??={};state.settings[id][d.key]=el.value;}
 if(a==='wizard-field')state.wizard[d.key]=el.value;
 if(a==='lux-trigger')state.wizard.trigger=el.checked?'lux':'sunset';
 if(a==='wizard-target')state.wizard.targets=toggleList(state.wizard.targets,el.value,el.checked);
 if(a==='action-field')state.wizard.actions[Number(d.index)][d.key]=el.value;
 if(a==='action-target'){const row=state.wizard.actions[Number(d.index)];row.targets=toggleList(row.targets,el.value,el.checked);}
 if(a==='condition')state.wizard.conditions[d.key]=el.type==='checkbox'?el.checked:el.value;
 if(a==='binding-action')rememberBinding().type=el.value;
 if(a==='binding-scene')rememberBinding().scene=el.value;
 if(a==='binding-target'){const b=rememberBinding();b.targets=toggleList(b.targets,el.value,el.checked);}
 if(['readout','condition','setting','wizard-target','action-target','binding-target'].includes(a))return;
 render();
});
// Standalone preview hooks: getState returns a read-only copy; apply/render/reset change the simulation. No network or storage API.
window.preview={getState:()=>clone(state),apply,render,reset:()=>{state=initial();palettes.splice(4);render();}};
const previewWidth=Number(new URLSearchParams(location.search).get('width'));
document.documentElement.style.setProperty('--frame-width',([320,390,430].includes(previewWidth)?previewWidth:430)+'px');
render();
</script>
