apply_palette:
  name: Farbpalette anwenden
  description: Wendet eine eigene Farbpalette auf zuvor freigegebene Einzellampen an.
  fields:
    palette_id:
      name: Farbpalette
      description: Kennung einer mitgelieferten Farbpalette, zum Beispiel kupfernest.
      required: true
      example: kupfernest
      selector:
        text:
    entity_ids:
      name: Lampen
      description: Nur in der Lichtzentrale freigegebene Einzellampen, keine Gruppen.
      required: true
      selector:
        entity:
          domain:
            - light
            - switch
          multiple: true
    brightness:
      name: Helligkeit
      description: Optionaler Helligkeitswert statt der Vorgabe aus der Farbpalette.
      selector:
        number:
          min: 1
          max: 255
          mode: slider
    transition:
      name: Übergang
      description: Übergangsdauer für Lampen, die Übergänge unterstützen.
      default: 1
      selector:
        number:
          min: 0
          max: 60
          step: 0.1
          unit_of_measurement: s
          mode: box

apply_scene:
  name: Szene anwenden
  description: Startet eine gespeicherte Raum-Szene und prüft erneut ihre Lampenfreigaben.
  fields:
    scene_id:
      name: Szene
      description: Kennung der in der Lichtzentrale gespeicherten Szene.
      required: true
      selector:
        text:

toggle_room:
  name: Raum schalten
  description: Schaltet ausschließlich die freigegebenen Einzellampen und Lichtschalter eines Bereichs.
  fields:
    area_id:
      name: Raum
      required: true
      selector:
        area:
    on:
      name: Einschalten
      description: Ohne Vorgabe wird der Raumzustand umgeschaltet.
      selector:
        boolean:
