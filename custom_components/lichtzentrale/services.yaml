apply_palette:
  name: Farbpalette anwenden
  description: Wendet eine eigene Farbpalette auf zuvor freigegebene Einzellampen an. Switch-Lichtschalter bleiben unverändert.
  fields:
    palette_id:
      name: Farbpalette
      description: Kennung einer mitgelieferten Farbpalette, zum Beispiel kupfernest.
      required: true
      example: kupfernest
      selector:
        text:
    entity_ids:
      name: Lampen
      description: Nur in der Lichtzentrale freigegebene Einzellampen, keine Gruppen.
      required: true
      selector:
        entity:
          domain:
            - light
            - switch
          multiple: true
    brightness:
      name: Helligkeit
      description: Optionaler Helligkeitswert statt der Vorgabe aus der Farbpalette.
      selector:
        number:
          min: 1
          max: 255
          mode: slider
    transition:
      name: Übergang
      description: Übergangsdauer für Lampen, die Übergänge unterstützen.
      default: 1
      selector:
        number:
          min: 0
          max: 60
          step: 0.1
          unit_of_measurement: s
          mode: box
    verteilung:
      name: Farbverteilung
      description: Räumliche Verteilung anhand der im Raum gespeicherten Lampenpositionen.
      default: zufall
      selector:
        select:
          options:
            - label: Zufall (bisherige Verteilung)
              value: zufall
            - label: Verlauf links nach rechts
              value: verlauf_links_rechts
            - label: Verlauf vorne nach hinten
              value: verlauf_vorne_hinten
            - label: Nach Höhe
              value: hoehe

apply_scene:
  name: Szene anwenden
  description: Startet eine gespeicherte Raum-Szene und prüft erneut ihre Lampenfreigaben.
  fields:
    scene_id:
      name: Szene
      description: Kennung der in der Lichtzentrale gespeicherten Szene.
      required: true
      selector:
        text:

toggle_room:
  name: Raum schalten
  description: Schaltet alle freigegebenen Raumlichter aus. Einschalten stellt vorher eingeschaltete Lampen und Switch-Lichter wieder her; reine Switch-Räume werden direkt geschaltet. Mit natürlichem Licht werden nur dessen Lampen aktiviert, nie Switch-Lichter.
  fields:
    area_id:
      name: Raum
      required: true
      selector:
        area:
    "on":
      name: Einschalten
      description: Ohne Vorgabe wird der Raumzustand umgeschaltet.
      selector:
        boolean:

stop_dynamic:
  name: Dynamische Szene stoppen
  description: Stoppt die lokale Dynamik und hält eingeschaltete freigegebene Raumlampen mit aktueller Farbe und Helligkeit fest, auch bei Hue-Dynamik. Ausgeschaltete Lampen bleiben aus.
  fields:
    area_id:
      name: Raum
      required: true
      selector:
        area:

set_adaptive:
  name: Natürliches Licht einstellen
  description: Steuert und konfiguriert optionales Adaptive Lighting ausschließlich für geprüfte Raumlampen.
  fields:
    area_id:
      name: Raum
      required: true
      selector:
        area:
    enabled:
      name: Natürliches Licht einschalten
      description: Ohne diese Angabe wird nur die Zuordnung oder Einschaltregel gespeichert.
      selector:
        boolean:
    adaptive_switch:
      name: Adaptive-Lighting-Schalter
      description: Nur echte Adaptive-Lighting-Hauptschalter mit ausschließlich freigegebenen Lampen dieses Raums sind zulässig.
      selector:
        entity:
          filter:
            - domain: switch
              integration: adaptive_lighting
    default_on:
      name: Verhalten beim Einschalten
      selector:
        select:
          options:
            - label: Natürliches Licht
              value: adaptive
            - label: Zuletzt verwendete Einstellung
              value: last
